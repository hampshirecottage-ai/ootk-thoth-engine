{# Shared footer with contact and bug report links. Styles are scoped to .site-footer so page layouts are untouched. #}
<style>
    .site-footer { margin: 28px auto 8px; padding-top: 12px; border-top: 1px solid var(--line); text-align: center; font-size: 0.85em; color: var(--muted); }
    .site-footer a { color: var(--accent); text-decoration: none; display: inline-block; padding: 6px 8px; }
    .site-footer a:hover { text-decoration: underline; }
    :root[data-theme="light"] .site-footer, :root[data-theme="light"] .site-footer a { color: #ffe0a0; }
    @media print { .site-footer { display: none; } }
</style>
<footer class="site-footer">
    <a href="/start">Start here</a> ·
    <a href="/history">History</a> ·
    <a href="/examples">Examples</a> ·
    <a href="/library">Library</a> ·
    <a href="/method">Method and limits</a> ·
    <a href="/today">Card of the day</a> ·
    <a href="{{ bug_report_url }}" target="_blank" rel="noopener">Report a bug</a> ·
    <a href="{{ contact_url }}" target="_blank" rel="noopener">Contact</a>
</footer>

{# Styles shared by the start page and the pick-by-hand page. #}
    <style>
        :root { --bg: #121212; --panel: #1e1e1e; --panel-2: #2a2a2a; --panel-3: #252525; --line: #333; --text: #e0e0e0; --muted: #9a9a9a; --accent: #bb86fc; --accent-2: #03dac6; --control: #444; --hover: #382b47; --on-accent: #000; color-scheme: dark; }
        :root[data-theme="light"] { --bg: #2e8a56; --panel: #a7e2c0; --panel-2: #94d6b0; --panel-3: #b9e9cd; --line: #5fae84; --text: #000; --muted: #0f2e1b; --accent: #0d2617; --accent-2: #0d2617; --control: #4f9e74; --hover: #c4eed6; --on-accent: #fff; color-scheme: light; }
        /* Text sitting straight on the green page background (not on a panel). */
        :root[data-theme="light"] header.top h1, :root[data-theme="light"] header.top p, :root[data-theme="light"] header.top p a { color: #f4a11a; }
        * { box-sizing: border-box; }
        ::placeholder { color: var(--muted); opacity: 0.75; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        h1, h2 { color: var(--accent); margin-top: 0; }
        h2 { font-size: 1.15em; }
        .container.single { grid-template-columns: minmax(280px, 560px); justify-content: center; }
        .container { display: grid; grid-template-columns: minmax(280px, 340px) minmax(260px, 1fr) minmax(300px, 1.3fr); gap: 20px; align-items: start; }
        .panel { background: var(--panel); padding: 16px; border-radius: 8px; border: 1px solid var(--line); }
        .settings { position: sticky; top: 20px; }
        .deck-panel { max-height: 88vh; overflow-y: auto; }
        label { display: block; font-size: 0.8em; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.04em; }
        input, select { width: 100%; padding: 8px 10px; margin-bottom: 12px; background: var(--panel-2); border: 1px solid var(--control); color: var(--text); border-radius: 4px; font-size: 0.95em; }
        .row { display: flex; gap: 6px; }
        .row > input, .row > select { flex: 1; }
        .row button { margin-bottom: 12px; }
        .seg { display: flex; border: 1px solid var(--control); border-radius: 6px; overflow: hidden; margin-bottom: 12px; }
        .seg label { flex: 1; margin: 0; text-align: center; padding: 8px 4px; cursor: pointer; color: var(--text); text-transform: none; letter-spacing: 0; font-size: 0.9em; background: var(--panel-2); }
        .seg input { display: none; }
        .seg input:checked + span { color: var(--on-accent); }
        .seg label:has(input:checked) { background: var(--accent); color: var(--on-accent); font-weight: 600; }
        .hint { font-size: 0.78em; color: var(--muted); margin: -8px 0 12px; }
        .sig-none { margin: 0 0 12px; }
        .sig-result { font-size: 0.9em; color: var(--muted); margin: 0 0 12px; }
        .sig-result strong { color: var(--text); }
        [hidden] { display: none !important; }
        button { font: inherit; }
        .btn-small { background: var(--panel-2); color: var(--text); border: 1px solid var(--control); padding: 6px 10px; border-radius: 4px; cursor: pointer; white-space: nowrap; }
        .btn-small:hover { border-color: var(--accent); }
        button.btn-submit { background: var(--accent); color: var(--on-accent); font-size: 1.05em; font-weight: bold; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 4px; }
        button.btn-submit:hover { background: var(--accent-2); }
        fieldset { border: none; border-top: 1px solid var(--line); margin: 6px 0 0; padding: 12px 0 0; }
        legend { color: var(--accent-2); font-weight: 600; font-size: 0.85em; padding-right: 6px; }
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; margin-top: 12px; }
        .card-item { background: var(--panel-2); border: 1px solid var(--control); border-radius: 6px; padding: 6px; text-align: center; cursor: pointer; transition: all 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
        .card-item:hover { background: var(--hover); border-color: var(--accent); transform: translateY(-3px); }
        .card-item.used { opacity: 0.3; }
        .card-item img, .card-item .noimg { width: 100%; height: 140px; object-fit: cover; border-radius: 4px; margin-bottom: 6px; background: var(--bg); }
        .card-item .noimg { display: flex; align-items: center; justify-content: center; font-size: 0.7em; color: var(--muted); border: 1px dashed var(--control); }
        .card-title { font-size: 0.75em; font-weight: 600; line-height: 1.2; }
        .slots { max-height: 60vh; overflow-y: auto; }
        .slot { background: var(--panel-3); border: 2px dashed var(--accent-2); border-radius: 6px; padding: 8px 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 0.85em; }
        .slot .pos-name { font-weight: bold; color: var(--accent-2); }
        .slot .card-selected { color: var(--text); background: var(--panel-2); padding: 3px 8px; border-radius: 4px; border: 1px solid var(--control); white-space: nowrap; }
        .credit { color: var(--muted); font-size: 0.82em; margin: 12px 0 0; }
        .optional { text-transform: none; letter-spacing: 0; }
        details.more { border-top: 1px solid var(--line); margin: 2px 0 12px; padding-top: 10px; }
        details.more > summary { cursor: pointer; color: var(--accent); font-size: 0.92em; padding: 4px 0; }
        details.more[open] > summary { margin-bottom: 10px; }
        .more-sum { color: var(--muted); font-size: 0.92em; margin-left: 4px; }
        .count { color: var(--muted); font-size: 0.85em; }
        /* Title and tagline centred; equal side columns keep them centred with the Theme button on the right. */
        header.top { display: grid; grid-template-columns: minmax(40px, 1fr) minmax(0, 70ch) minmax(40px, 1fr); align-items: start; gap: 12px; margin-bottom: 14px; text-align: center; }
        header.top > div { grid-column: 2; }
        header.top #themeToggle { grid-column: 3; justify-self: end; }
        header.top h1 { margin: 0; }
        header.top h1 a.home { color: inherit; text-decoration: none; }
        @media (max-width: 640px) { .wide-only { display: none; } }
        .mode-link { font-size: 0.88em; margin: 12px 0 0; color: var(--muted); text-align: center; }
        .mode-link a { color: var(--accent); }
        .tagline { margin: 4px auto 0; color: var(--muted); max-width: 70ch; line-height: 1.4; }
        .pick-bar { display: none; }
        @media (max-width: 1100px) {
            .container { grid-template-columns: 1fr; } .settings { position: static; } .deck-panel { max-height: none; }
            body.manual { padding-bottom: 96px; }
            body.manual .pick-bar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; gap: 8px; align-items: center; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: var(--panel); border-top: 1px solid var(--line); box-shadow: 0 -6px 18px rgba(0,0,0,0.25); }
            .pick-bar .status { flex: 1; min-width: 0; font-size: 0.85em; line-height: 1.3; }
            .pick-bar .status strong { color: var(--accent-2); }
            .pick-bar .last { display: block; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
            .pick-bar button.btn-submit { width: auto; margin: 0; padding: 10px 14px; font-size: 0.95em; }
        }
        @media (max-width: 640px) {
            body { padding: 12px; }
            header.top { gap: 8px; }
            header.top h1 { font-size: 1.5em; }
            .tagline { font-size: 0.92em; }
            .panel { padding: 14px; }
            /* 16px stops iOS Safari zooming the page when a field is focused. */
            input, select { font-size: 16px; }
            .card-grid { grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
            .card-item img, .card-item .noimg { height: 118px; }
            .card-item:hover { transform: none; }
            .slot { flex-wrap: wrap; }
            .slot .card-selected { white-space: normal; }
        }
        @media (pointer: coarse) {
            .btn-small { min-height: 40px; min-width: 40px; }
            .seg label { padding: 10px 4px; }
        }
    </style>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OOTK Thoth Graphic GUI</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        h1, h2 { color: #bb86fc; margin-top: 0; }
        .container { display: flex; gap: 20px; }
        .deck-panel { flex: 1.2; max-height: 88vh; overflow-y: auto; background: #1e1e1e; padding: 15px; border-radius: 8px; border: 1px solid #333; }
        .spread-panel { flex: 0.8; background: #1e1e1e; padding: 15px; border-radius: 8px; border: 1px solid #333; }
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; margin-top: 15px; }
        .card-item { background: #2a2a2a; border: 1px solid #444; border-radius: 6px; padding: 8px; text-align: center; cursor: pointer; transition: all 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
        .card-item:hover { background: #382b47; border-color: #bb86fc; transform: translateY(-3px); box-shadow: 0 4px 12px rgba(187, 134, 252, 0.2); }
        .card-item img { width: 100%; height: 150px; object-fit: cover; border-radius: 4px; margin-bottom: 6px; background: #121212; }
        .card-title { font-size: 0.8em; font-weight: 600; color: #e0e0e0; line-height: 1.2; }
        .slot { background: #252525; border: 2px dashed #03dac6; border-radius: 6px; padding: 10px 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .slot span.pos-name { font-weight: bold; color: #03dac6; font-size: 0.9em; }
        .slot span.card-selected { color: #fff; font-weight: bold; background: #333; padding: 4px 10px; border-radius: 4px; border: 1px solid #555; font-size: 0.85em; }
        button.btn-submit { background: #bb86fc; color: #000; font-size: 1.05em; font-weight: bold; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 15px; }
        button.btn-submit:hover { background: #03dac6; }
        input, select { width: 100%; padding: 8px 12px; margin-bottom: 12px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
    </style>
</head>
<body>

    <h1>OOTK Thoth Deck — Visual Card Selector</h1>

    <div class="container">
        <!-- LEFT: Deck Selector -->
        <div class="deck-panel">
            <h2>Card Catalog</h2>
            <input type="text" id="search" placeholder="Search cards by name or element..." onkeyup="filterCards()">
            
            <div class="card-grid" id="cardGrid">
                {% for card in cards %}
                {% set slug = card.title.lower().replace(' ', '-').replace("'", '') %}
                <div class="card-item" onclick="selectCard('{{ card.title }}')">
                    <img src="/static/images/{{ slug }}.jpg" 
                            alt="{{ card.title }}" 
                            onerror="this.onerror=null; this.src='https://placehold.co/200x320/1e1e1e/bb86fc?text={{ card.title | replace(' ', '+') }}';">
                    <div class="card-title">{{ card.title }}</div>
                </div>
                {% endfor %}
            </div>
        </div>

        <!-- RIGHT: Active Spread Board -->
        <div class="spread-panel">
            <h2>Spread Board</h2>
            <form action="/generate_report" method="POST">
                <label>Operation / Spread:</label>
                <select name="spread_key" id="spreadSelect" onchange="updateSlots()">
                    {% for key, spread in spreads.items() %}
                    <option value="{{ key }}">{{ spread.name }}</option>
                    {% endfor %}
                </select>

                <label>Tarot-Kabbalah Mapping Scheme:</label>
                <select name="mapping_system">
                    <option value="golden_dawn">Golden Dawn / English System (Liber 777)</option>
                    <option value="french_egyptian">French / Egyptian System (Lévi / Papus / Wirth)</option>
                </select>

                <label>Macro Conceptual Framework:</label>
                <select name="framework">
                    <option value="auto">Auto-Detect Framework from Draw</option>
                    <option value="light_descent">1. Divine Light Flow (Aleph -> Tav)</option>
                    <option value="soul_formation">2. Pre-Incarnation Soul Formation</option>
                    <option value="life_path">3. Incarnational Life Path & Evolution</option>
                    <option value="post_mortem">4. Post-Mortem Return (Book of the Dead)</option>
                </select>

                <label>Query Topic:</label>
                <input type="text" name="topic" placeholder="Operational Topic / Intent">

                <label>Significator:</label>
                <input type="text" name="significator" value="Knight of Swords">

                <div id="spreadSlots"></div>

                <input type="hidden" name="selected_cards" id="selectedCardsInput">
                <button type="submit" class="btn-submit">Generate Hermetic Synthesis Report</button>
            </form>
        </div>
    </div>

    <script>
        const spreadsData = {{ spreads | tojson }};
        let activeCardList = [];

        function updateSlots() {
            const key = document.getElementById("spreadSelect").value;
            const spread = spreadsData[key];
            const slotsContainer = document.getElementById("spreadSlots");
            slotsContainer.innerHTML = "";
            activeCardList = [];

            const positions = spread.positions || ["Core Focus"];
            positions.forEach((pos, idx) => {
                const div = document.createElement("div");
                div.className = "slot";
                div.innerHTML = `<span class="pos-name">${pos}</span><span class="card-selected" id="slot-${idx}">[ Empty ]</span>`;
                slotsContainer.appendChild(div);
            });
            syncHiddenInput();
        }

        function selectCard(cardTitle) {
            const key = document.getElementById("spreadSelect").value;
            const spread = spreadsData[key];
            const positions = spread.positions || ["Core Focus"];

            if (activeCardList.length < positions.length) {
                const targetIdx = activeCardList.length;
                activeCardList.push(cardTitle);
                document.getElementById(`slot-${targetIdx}`).innerText = cardTitle;
                syncHiddenInput();
            } else {
                alert("All spread slots are currently filled!");
            }
        }

        function syncHiddenInput() {
            document.getElementById("selectedCardsInput").value = activeCardList.join(",");
        }

        function filterCards() {
            const query = document.getElementById("search").value.toLowerCase();
            const items = document.querySelectorAll(".card-item");
            items.forEach(item => {
                item.style.display = item.innerText.toLowerCase().includes(query) ? "flex" : "none";
            });
        }

        updateSlots();
    </script>
</body>
</html>

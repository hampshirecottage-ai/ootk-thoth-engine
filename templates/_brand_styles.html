{# The site's look, shared by every page: the self-hosted fonts, the OOTK bar along the top and the
   darker green banner each page opens on. Pages set their own banner layout on top of .band. -#}
    <style>
        /* Banner fonts, served from /static/fonts (the CSP allows only same-origin fonts). */
        @font-face { font-family: "Cinzel"; font-weight: 400 900; font-display: swap; src: url("{{ static_url('fonts/cinzel-latin.woff2') }}") format("woff2"); }
        @font-face { font-family: "Inter"; font-weight: 100 900; font-display: swap; src: url("{{ static_url('fonts/inter-latin.woff2') }}") format("woff2"); }
        @font-face { font-family: "JetBrains Mono"; font-weight: 100 800; font-display: swap; src: url("{{ static_url('fonts/jetbrains-mono-latin.woff2') }}") format("woff2"); }
        body { font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        code, pre, kbd { font-family: "JetBrains Mono", ui-monospace, monospace; }
        /* Banner colours: a darker green band with cream text on the green theme, the panel colours on the dark one. */
        :root { --band-bg: var(--panel); --band-line: var(--line); --band-text: var(--text); --band-head: var(--accent); --tile-bg: var(--panel-2); --page-width: 1160px; }
        :root[data-theme="light"] { --band-bg: #24704a; --band-line: #5fae84; --band-text: #ffe0a0; --band-head: #ffe0a0; --tile-bg: var(--panel); }
        .site-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; max-width: var(--page-width); margin: 0 auto 14px; }
        .brand { font-family: "Cinzel", serif; font-weight: 800; letter-spacing: 0.12em; color: var(--band-head); text-decoration: none; line-height: 1.15; }
        :root[data-theme="light"] .brand { color: #ffe0a0; }
        .brand small { display: block; font-family: "JetBrains Mono", monospace; font-weight: 400; letter-spacing: 0.04em; font-size: 0.7em; opacity: 0.85; }
        .band { max-width: var(--page-width); margin: 0 auto 20px; box-sizing: border-box; background: var(--band-bg); border: 1px solid var(--band-line); border-radius: 14px; padding: 24px 26px; box-shadow: 0 0 24px rgba(255, 224, 160, 0.12); color: var(--band-text); }
        .band h1 { font-family: "Cinzel", serif; font-weight: 800; letter-spacing: 0.02em; color: var(--band-head); margin: 8px 0 0; font-size: 1.9em; line-height: 1.2; }
        .band p, .band p a, .band .steps li { color: var(--band-text); }
        .band .tagline { margin: 8px 0 0; max-width: 60ch; color: var(--band-text); line-height: 1.45; }
        .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; }
        .chips span { font-family: "JetBrains Mono", monospace; font-size: 0.74em; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 9px; border-radius: 6px; border: 1px solid color-mix(in srgb, var(--band-text) 40%, transparent); background: color-mix(in srgb, var(--band-text) 8%, transparent); }
        /* A short banner for the guide pages: title, tagline and the guide links. */
        .band.page-head { text-align: center; padding: 20px 22px 16px; }
        .band.page-head h1 { margin: 0; font-size: 1.7em; }
        .band.page-head .tagline { margin: 6px auto 0; }
        @media (max-width: 860px) {
            .band { padding: 18px 16px; }
            .band h1 { font-size: 1.4em; }
            .band.page-head h1 { font-size: 1.35em; }
        }
    </style>

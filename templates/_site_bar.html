{# The OOTK name along the top of every page, with the theme switch. The front page also shows the open source line between them. -#}
    <header class="site-bar">
        <a class="brand" href="/">OOTK<small>Thoth Engine</small></a>
        {% if show_open_source %}<p class="trust">Free and <a href="{{ repo_url }}" target="_blank" rel="noopener">open source</a></p>{% endif %}

    </header>

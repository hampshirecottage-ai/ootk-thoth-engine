name: tests

on:
  push:
    branches: [main]
  pull_request:

# Read-only token by default; no job needs to write.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A throwaway PostgreSQL loaded from database/schema.sql, so the database tests (saving,
    # report links, testimonials) run on every PR instead of being skipped. Keep the major
    # version the same as the live Neon database (17.11 on 2026-10-05).
    services:
      postgres:
        image: postgres:17@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: ootk_test
          # A throwaway database on the runner, so no password at all.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OOTK_TEST_DB: "1"
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: ootk_test
      DB_USER: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -c requirements-lock.txt -e ".[dev]"
      - name: Load the schema
        run: psql -v ON_ERROR_STOP=1 -q -f database/schema.sql
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGDATABASE: ootk_test
      - run: python -m pytest -q

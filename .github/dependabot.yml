version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      pydantic:                        # pydantic pins pydantic-core exactly, so bump them together
        patterns: ["pydantic", "pydantic-core", "pydantic_core"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

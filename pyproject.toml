[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ootk-thoth-engine"
version = "1.0.0"
description = "Hermetic tarot calculation engine for the Thoth deck (Opening of the Key)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "brotli",
    "fastapi",
    "uvicorn",
    "jinja2",
    "psycopg[binary]",
    "python-dotenv",
    "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "pillow", "rich"]
images = ["pillow", "fonttools[woff]"]
# scripts/view_output.py only; the web app and CLI don't use it, so the server doesn't install it.
viewer = ["rich"]
# scripts/ai_score.py run / extract / pilot only (they call the Claude API).
aicheck = ["anthropic"]

[project.scripts]
ootk = "ootk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

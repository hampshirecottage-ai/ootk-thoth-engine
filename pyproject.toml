[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ootk-thoth-engine"
version = "1.0.0"
description = "Hermetic tarot calculation engine for the Thoth deck (Opening of the Key)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "jinja2",
    "psycopg[binary]",
    "python-dotenv",
    "python-multipart",
    "rich",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
ootk = "ootk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

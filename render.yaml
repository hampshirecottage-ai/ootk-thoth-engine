# Render Blueprint: the web GUI on Render's free plan, using the same Dockerfile.
# Readings live in an external PostgreSQL (e.g. Neon); fill in the secrets when Render asks.
services:
  - type: web
    name: ootk
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Encrypt the database connection and refuse a server that won't (Neon requires it).
      - key: PGSSLMODE
        value: require
      - key: APP_PASSWORD
        sync: false
      # Password for the unlinked /admin page (approving testimonials); leave empty to turn it off.
      - key: ADMIN_PASSWORD
        sync: false
      # Key for hashing visitors' IP addresses stored with testimonials (the address itself never is).
      - key: VISITOR_HASH_KEY
        generateValue: true

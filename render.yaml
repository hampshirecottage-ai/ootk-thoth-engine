# Render Blueprint: the web GUI on Render's free plan, using the same Dockerfile.
# Readings live in an external PostgreSQL (e.g. Neon); fill in the secrets when Render asks.
services:
  - type: web
    name: ootk
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Encrypt the database connection and refuse a server that won't (Neon requires it).
      - key: PGSSLMODE
        value: require
      - key: APP_PASSWORD
        sync: false
      # Password for the unlinked /admin page (contact messages and saved readings); leave empty to turn it off.
      - key: ADMIN_PASSWORD
        sync: false
      # Private ntfy topic for the busy-server alert (CPU high for 5 minutes); leave empty to turn it off.
      - key: BUSY_ALERT_NTFY_TOPIC
        sync: false
      # ntfy topic for "new contact message" pushes; empty uses BUSY_ALERT_NTFY_TOPIC, and with
      # neither set no alerts are sent (messages are still saved for /admin/messages).
      - key: CONTACT_ALERT_NTFY_TOPIC
        sync: false
      # Access token from a free ntfy.sh account; without it ntfy.sh may refuse pushes from Render's shared addresses (HTTP 429).
      - key: NTFY_TOKEN
        sync: false
      # Telegram alerts (busy server, new contact message) from your own bot: token from @BotFather,
      # your chat id from @userinfobot. Both empty: no Telegram alerts.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
